<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacks Library Management System</title>
<meta name="description" content="Manage books, members, issues and returns from one clean dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edef; --panel:#f8fafa; --ink:#14202a; --muted:#5b6b76; --line:#cfd8dd;
  --green:#14403b; --green-2:#1d5c54; --brass:#b6862c; --red:#b3402f; --ok:#2f7a4f;
  --radius:10px;
}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 "Instrument Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:700;line-height:1.15}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--green);color:#e7f0ee;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px}
.brand{font-family:Newsreader,serif;font-size:28px;font-weight:700;letter-spacing:.2px}
.brand small{display:block;font:500 12.5px "Instrument Sans";color:#9fc2bc;margin-top:2px}
nav{display:flex;flex-direction:column;gap:4px}
nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;color:#cfe2de;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.08)}
nav button[aria-current=page]{background:#e9edef;color:var(--green);font-weight:600}
main{padding:34px clamp(16px,4vw,48px) 60px;max-width:1150px;width:100%}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:34px}
.head p{color:var(--muted);margin-top:4px}
.btn{background:var(--green);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--green-2)}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{font:700 30px Newsreader,serif;display:block}
.stat span{color:var(--muted);font-size:13.5px}
.stat.warn b{color:var(--red)}
.shelf-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 0;margin-bottom:26px}
.shelf-wrap h2{font-size:22px;margin-bottom:2px}
.shelf-wrap p{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.shelf{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding-bottom:0;border-bottom:10px solid #6b4a2b;min-height:150px}
.spine{flex:none;width:30px;border-radius:3px 3px 0 0;color:#fff;font-size:11.5px;writing-mode:vertical-rl;padding:8px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;cursor:default}
.spine.out{opacity:.35;background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.35) 5px 7px)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);padding:10px 0 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--green);vertical-align:-1px;margin-right:5px}
.legend i.o{opacity:.35}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tools{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
input,select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.tools input{flex:1;min-width:180px}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.table td{padding:11px 14px;border-bottom:1px solid #e3e9ec;vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;background:#dbe8e5;color:var(--green)}
.tag.late{background:#f3d9d3;color:var(--red)}
.tag.done{background:#dcebe1;color:var(--ok)}
.tag.zero{background:#eceff1;color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
dialog{border:0;border-radius:12px;padding:0;width:min(440px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,25,30,.5)}
dialog form{padding:22px;display:grid;gap:12px}
dialog h3{font-size:24px}
label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;align-items:center;justify-content:space-between;padding:12px 14px;gap:10px;flex-wrap:wrap}
  .brand small{display:none}
  nav{flex-direction:row;overflow-x:auto;width:100%}
  nav button{white-space:nowrap}
  .head h1{font-size:28px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Stacks<small>Library Management System</small></div>
    <nav id="nav" aria-label="Main">
      <button data-v="dashboard">Dashboard</button>
      <button data-v="books">Books</button>
      <button data-v="members">Members</button>
      <button data-v="loans">Issue &amp; Return</button>
    </nav>
  </aside>
  <main id="view"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const LOAN_DAYS=14, FINE_PER_DAY=5;
const CATS={Fiction:"#14403b",Science:"#2d5a8a",Technology:"#6a3d7c",History:"#8a5a2b",Biography:"#a0453a",Philosophy:"#4a5a3a"};
const day=86400000;
const iso=d=>new Date(d).toISOString().slice(0,10);
const today=()=>iso(Date.now());
const addDays=(s,n)=>iso(new Date(s).getTime()+n*day);
const diffDays=(a,b)=>Math.round((new Date(a)-new Date(b))/day);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

function seed(){
  const books=[
    ["The Alchemist","Paulo Coelho","Fiction",4],["Sapiens","Yuval Noah Harari","History",3],
    ["A Brief History of Time","Stephen Hawking","Science",2],["Clean Code","Robert C. Martin","Technology",3],
    ["Wings of Fire","A. P. J. Abdul Kalam","Biography",5],["The Discovery of India","Jawaharlal Nehru","History",2],
    ["Introduction to Algorithms","Cormen, Leiserson, Rivest, Stein","Technology",2],["The Republic","Plato","Philosophy",2],
    ["Cosmos","Carl Sagan","Science",3],["The Guide","R. K. Narayan","Fiction",3],
    ["Gitanjali","Rabindranath Tagore","Fiction",2],["The Pragmatic Programmer","Hunt and Thomas","Technology",2]
  ].map((b,i)=>({id:uid(),title:b[0],author:b[1],category:b[2],isbn:"978-81-"+(1000+i*37),copies:b[3]}));
  const members=[["Aarav Sharma","aarav@example.com","9800000001"],["Priya Patil","priya@example.com","9800000002"],["Rohan Deshmukh","rohan@example.com","9800000003"],["Sneha Iyer","sneha@example.com","9800000004"]]
    .map(m=>({id:uid(),name:m[0],email:m[1],phone:m[2],joined:addDays(today(),-90)}));
  const loans=[
    {id:uid(),bookId:books[0].id,memberId:members[0].id,issued:addDays(today(),-20),due:addDays(today(),-6),returned:null},
    {id:uid(),bookId:books[3].id,memberId:members[1].id,issued:addDays(today(),-5),due:addDays(today(),9),returned:null},
    {id:uid(),bookId:books[1].id,memberId:members[2].id,issued:addDays(today(),-30),due:addDays(today(),-16),returned:addDays(today(),-14)}
  ];
  return {books,members,loans};
}
let db;
try{db=JSON.parse(localStorage.getItem("stacks_db"))}catch(e){}
if(!db||!db.books)db=seed();
const save=()=>{try{localStorage.setItem("stacks_db",JSON.stringify(db))}catch(e){}};

const bookById=id=>db.books.find(b=>b.id===id);
const memberById=id=>db.members.find(m=>m.id===id);
const outCount=id=>db.loans.filter(l=>l.bookId===id&&!l.returned).length;
const avail=b=>b.copies-outCount(b.id);
const fineOf=l=>{const end=l.returned||today();return Math.max(0,diffDays(end,l.due))*FINE_PER_DAY};
const isLate=l=>!l.returned&&diffDays(today(),l.due)>0;

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}

let view="dashboard", q={books:"",cat:"All",members:"",loans:"all"};
const $v=document.getElementById("view");

function nav(){document.querySelectorAll("#nav button").forEach(b=>b.toggleAttribute("aria-current",b.dataset.v===view)||b.removeAttribute("aria-current"));
  document.querySelectorAll("#nav button").forEach(b=>{if(b.dataset.v===view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")})}

function render(){nav();({dashboard,books,members,loans})[view]();}

function dashboard(){
  const out=db.loans.filter(l=>!l.returned), late=out.filter(isLate);
  const fines=db.loans.reduce((s,l)=>s+fineOf(l),0);
  const spines=db.books.map(b=>{
    const h=90+(b.title.length*3%50)+(b.copies*4);
    return `<div class="spine ${avail(b)===0?"out":""}" style="height:${h}px;background:${CATS[b.category]||"#444"}" title="${esc(b.title)} by ${esc(b.author)}: ${avail(b)} of ${b.copies} available">${esc(b.title)}</div>`}).join("");
  $v.innerHTML=`
  <div class="head"><div><h1>Dashboard</h1><p>Today is ${new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}.</p></div>
  <button class="btn" onclick="issueDlg()">Issue a book</button></div>
  <div class="stats">
    <div class="stat"><b>${db.books.length}</b><span>Book titles</span></div>
    <div class="stat"><b>${db.books.reduce((s,b)=>s+b.copies,0)}</b><span>Total copies</span></div>
    <div class="stat"><b>${db.members.length}</b><span>Members</span></div>
    <div class="stat"><b>${out.length}</b><span>Currently issued</span></div>
    <div class="stat ${late.length?"warn":""}"><b>${late.length}</b><span>Overdue</span></div>
    <div class="stat ${fines?"warn":""}"><b>₹${fines}</b><span>Fines (all time)</span></div>
  </div>
  <section class="shelf-wrap"><h2>The shelf</h2><p>Every title in the library. Striped spines have no copy on the shelf right now.</p>
    <div class="shelf">${spines||'<div class="empty">No books yet.</div>'}</div></section>
  <div class="legend">${Object.entries(CATS).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join("")}<span><i class="o"></i>All copies issued</span></div>
  <h2 style="margin:10px 0 10px;font-size:22px">Overdue books</h2>
  <div class="panel scroll">${late.length?`<table class="table"><tr><th>Book</th><th>Member</th><th>Due</th><th>Fine</th><th></th></tr>${late.map(l=>`<tr><td>${esc(bookById(l.bookId)?.title)}</td><td>${esc(memberById(l.memberId)?.name)}</td><td>${l.due}</td><td><span class="tag late">₹${fineOf(l)}</span></td><td><button class="btn small" onclick="returnBook('${l.id}')">Return</button></td></tr>`).join("")}</table>`:'<div class="empty">Nothing overdue. All books are on time.</div>'}</div>`;
}

function books(){
  const cats=["All",...Object.keys(CATS)];
  const list=db.books.filter(b=>(q.cat==="All"||b.category===q.cat)&&(b.title+b.author+b.isbn).toLowerCase().includes(q.books.toLowerCase()));
  $v.innerHTML=`<div class="head"><div><h1>Books</h1><p>${db.books.length} titles in the catalogue.</p></div><button class="btn" onclick="bookDlg()">Add book</button></div>
  <div class="panel"><div class="tools"><input id="s" placeholder="Search by title, author or ISBN" value="${esc(q.books)}" aria-label="Search books">
  <select id="c" aria-label="Category">${cats.map(c=>`<option ${c===q.cat?"selected":""}>${c}</option>`).join("")}</select></div>
  <div class="scroll">${list.length?`<table class="table"><tr><th>Title</th><th>Author</th><th>Category</th><th>Available</th><th></th></tr>${list.map(b=>`<tr><td><b>${esc(b.title)}</b><br><small style="color:var(--muted)">${esc(b.isbn)}</small></td><td>${esc(b.author)}</td><td>${esc(b.category)}</td><td><span class="tag ${avail(b)?"":"zero"}">${avail(b)} / ${b.copies}</span></td><td><div class="actions"><button class="btn small ghost" onclick="bookDlg('${b.id}')">Edit</button><button class="btn small danger" onclick="delBook('${b.id}')">Delete</button></div></td></tr>`).join("")}</table>`:'<div class="empty">No books match your search. Try a different word or add a new book.</div>'}</div></div>`;
  const s=document.getElementById("s");s.oninput=e=>{q.books=e.target.value;const p=e.target.selectionStart;books();const n=document.getElementById("s");n.focus();n.setSelectionRange(p,p)};
  document.getElementById("c").onchange=e=>{q.cat=e.target.value;books()};
}

function members(){
  const list=db.members.filter(m=>(m.name+m.email+m.phone).toLowerCase().includes(q.members.toLowerCase()));
  $v.innerHTML=`<div class="head"><div><h1>Members</h1><p>${db.members.length} registered readers.</p></div><button class="btn" onclick="memberDlg()">Add member</button></div>
  <div class="panel"><div class="tools"><input id="s" placeholder="Search by name, email or phone" value="${esc(q.members)}" aria-label="Search members"></div>
  <div class="scroll">${list.length?`<table class="table"><tr><th>Name</th><th>Contact</th><th>Books held</th><th></th></tr>${list.map(m=>{const n=db.loans.filter(l=>l.memberId===m.id&&!l.returned).length;return `<tr><td><b>${esc(m.name)}</b><br><small style="color:var(--muted)">Joined ${m.joined}</small></td><td>${esc(m.email)}<br>${esc(m.phone)}</td><td><span class="tag ${n?"":"zero"}">${n}</span></td><td><div class="actions"><button class="btn small ghost" onclick="memberDlg('${m.id}')">Edit</button><button class="btn small danger" onclick="delMember('${m.id}')">Remove</button></div></td></tr>`}).join("")}</table>`:'<div class="empty">No members found. Add a member to start issuing books.</div>'}</div></div>`;
  document.getElementById("s").oninput=e=>{q.members=e.target.value;const p=e.target.selectionStart;members();const n=document.getElementById("s");n.focus();n.setSelectionRange(p,p)};
}

function loans(){
  const f=q.loans;
  const list=[...db.loans].reverse().filter(l=>f==="all"||(f==="out"&&!l.returned)||(f==="late"&&isLate(l))||(f==="back"&&l.returned));
  $v.innerHTML=`<div class="head"><div><h1>Issue &amp; Return</h1><p>Loan period is ${LOAN_DAYS} days. Late fine is ₹${FINE_PER_DAY} per day.</p></div><button class="btn" onclick="issueDlg()">Issue a book</button></div>
  <div class="panel"><div class="tools"><select id="f" aria-label="Filter loans"><option value="all">All records</option><option value="out">Currently issued</option><option value="late">Overdue</option><option value="back">Returned</option></select></div>
  <div class="scroll">${list.length?`<table class="table"><tr><th>Book</th><th>Member</th><th>Issued</th><th>Due</th><th>Status</th><th></th></tr>${list.map(l=>`<tr><td>${esc(bookById(l.bookId)?.title||"Deleted book")}</td><td>${esc(memberById(l.memberId)?.name||"Removed member")}</td><td>${l.issued}</td><td>${l.due}</td><td>${l.returned?`<span class="tag done">Returned ${l.returned}${fineOf(l)?` (fine ₹${fineOf(l)})`:""}</span>`:isLate(l)?`<span class="tag late">Overdue, ₹${fineOf(l)}</span>`:'<span class="tag">Issued</span>'}</td><td>${l.returned?"":`<button class="btn small" onclick="returnBook('${l.id}')">Return</button>`}</td></tr>`).join("")}</table>`:'<div class="empty">No records here yet. Issue a book to create one.</div>'}</div></div>`;
  const s=document.getElementById("f");s.value=f;s.onchange=e=>{q.loans=e.target.value;loans()};
}

const dlg=document.getElementById("dlg");
function open(html,onSubmit){
  dlg.innerHTML=`<form method="dialog">${html}</form>`;
  dlg.querySelector("form").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(onSubmit(d)!==false)dlg.close()};
  dlg.querySelector("[data-cancel]").onclick=()=>dlg.close();
  dlg.showModal();
}
function bookDlg(id){
  const b=id?bookById(id):{title:"",author:"",category:"Fiction",isbn:"",copies:1};
  open(`<h3>${id?"Edit book":"Add book"}</h3>
  <label>Title<input name="title" required value="${esc(b.title)}"></label>
  <label>Author<input name="author" required value="${esc(b.author)}"></label>
  <div class="cols2"><label>Category<select name="category">${Object.keys(CATS).map(c=>`<option ${c===b.category?"selected":""}>${c}</option>`).join("")}</select></label>
  <label>Copies<input name="copies" type="number" min="${id?outCount(id)||1:1}" required value="${b.copies}"></label></div>
  <label>ISBN<input name="isbn" value="${esc(b.isbn)}"></label>
  <div class="row"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn">Save book</button></div>`,d=>{
    d.copies=+d.copies;
    if(id)Object.assign(b,d);else db.books.push({id:uid(),...d});
    save();toast(id?"Book updated":"Book added");render();});
}
function memberDlg(id){
  const m=id?memberById(id):{name:"",email:"",phone:""};
  open(`<h3>${id?"Edit member":"Add member"}</h3>
  <label>Full name<input name="name" required value="${esc(m.name)}"></label>
  <label>Email<input name="email" type="email" required value="${esc(m.email)}"></label>
  <label>Phone<input name="phone" required value="${esc(m.phone)}"></label>
  <div class="row"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn">Save member</button></div>`,d=>{
    if(id)Object.assign(m,d);else db.members.push({id:uid(),joined:today(),...d});
    save();toast(id?"Member updated":"Member added");render();});
}
function issueDlg(){
  const bs=db.books.filter(b=>avail(b)>0);
  if(!bs.length||!db.members.length){toast(!db.members.length?"Add a member first":"No copies available right now");return}
  open(`<h3>Issue a book</h3>
  <label>Book<select name="bookId">${bs.map(b=>`<option value="${b.id}">${esc(b.title)} (${avail(b)} left)</option>`).join("")}</select></label>
  <label>Member<select name="memberId">${db.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select></label>
  <p style="color:var(--muted);font-size:13.5px">Due date will be ${addDays(today(),LOAN_DAYS)}.</p>
  <div class="row"><button type="button" class="btn ghost" data-cancel>Cancel</button><button class="btn">Issue book</button></div>`,d=>{
    db.loans.push({id:uid(),bookId:d.bookId,memberId:d.memberId,issued:today(),due:addDays(today(),LOAN_DAYS),returned:null});
    save();toast("Book issued");render();});
}
function returnBook(id){
  const l=db.loans.find(x=>x.id===id);l.returned=today();save();
  const f=fineOf(l);toast(f?`Returned. Collect a fine of ₹${f}`:"Book returned");render();
}
function delBook(id){
  if(outCount(id)){toast("This book is currently issued. Return it first.");return}
  if(confirm("Delete this book from the catalogue?")){db.books=db.books.filter(b=>b.id!==id);save();toast("Book deleted");render()}
}
function delMember(id){
  if(db.loans.some(l=>l.memberId===id&&!l.returned)){toast("This member still holds books.");return}
  if(confirm("Remove this member?")){db.members=db.members.filter(m=>m.id!==id);save();toast("Member removed");render()}
}
document.getElementById("nav").onclick=e=>{const v=e.target.dataset.v;if(v){view=v;render()}};
render();
</script>
</body>
</html>
